{% extends 'base.html' %}
{% block title %}Delete {{ model_name }} | Goldi ERP{% endblock %}
{% block content %}<div class="max-w-xl mx-auto px-6 animate-in"><div class="glass p-8 text-center"><span class="h-16 w-16 rounded-full bg-rose-400/10 border border-rose-300/20 text-rose-300 inline-flex items-center justify-center text-2xl"><i class="fas fa-trash"></i></span><h2 class="text-2xl text-white font-semibold mt-5">Delete {{ model_name }}?</h2><p class="text-slate-400 mt-3">This will permanently remove <strong class="text-white">{{ object }}</strong>. Use reversal or correction documents for posted transactions.</p><form method="post" class="flex gap-3 justify-center mt-7">{% csrf_token %}<a href="{% url 'master_crud' slug %}" class="glass px-5 py-3 text-slate-300">Cancel</a><button class="bg-rose-500/80 hover:bg-rose-500 px-5 py-3 rounded-xl text-white font-semibold" type="submit">Delete record</button></form></div></div>{% endblock %}
