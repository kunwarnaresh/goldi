{% extends "base.html" %}

{% block title %}Confirm Delete - Goldi ERP{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 pb-32 pt-8">
    <div class="glass-glow p-8 border border-red-500/30">
        <h2 class="text-2xl font-bold text-red-400 mb-4"><i class="fas fa-exclamation-triangle mr-2"></i>Confirm Deletion</h2>
        <p class="text-gray-300 mb-6">Are you sure you want to delete <strong>{{ customer.name }}</strong>? This action cannot be undone.</p>
        <form method="post" class="flex gap-4">
            {% csrf_token %}
            <button type="submit" class="px-6 py-3 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg font-semibold transition">
                <i class="fas fa-trash mr-2"></i>Delete
            </button>
            <a href="{% url 'customer_list' %}" class="px-6 py-3 bg-white/10 hover:bg-white/20 text-white rounded-lg font-semibold transition">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
